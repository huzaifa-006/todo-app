<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px; border-bottom: 1px solid #ccc; display: flex; justify-content: space-between; }
    button { margin-left: 10px; }
    .done { text-decoration: line-through; color: gray; }
  </style>
</head>
<body>
  <h1>To-Do List</h1>
  <input id="taskInput" placeholder="Enter a task">
  <button onclick="addTask()">Add Task</button>
  <ul id="taskList"></ul>

  <script>
    const API_URL = '/tasks';

    async function fetchTasks() {
      const res = await fetch(API_URL);
      const tasks = await res.json();
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="${task.done ? 'done' : ''}">${task.title}</span>
          <div>
            <button onclick="toggleTask(${task.id})">${task.done ? 'Undo' : 'Done'}</button>
            <button onclick="deleteTask(${task.id})">Delete</button>
          </div>
        `;
        list.appendChild(li);
      });
    }

    async function addTask() {
      const title = document.getElementById('taskInput').value;
      if (!title) return;
      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title })
      });
      document.getElementById('taskInput').value = '';
      fetchTasks();
    }

    async function toggleTask(id) {
      await fetch(`${API_URL}/${id}`, { method: 'PUT' });
      fetchTasks();
    }

    async function deleteTask(id) {
      await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
      fetchTasks();
    }

    fetchTasks();
  </script>
</body>
</html>
